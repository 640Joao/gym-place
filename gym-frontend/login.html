<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | GymCompare</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="#" class="logo">Gym<span>Compare</span></a>
        <p>Acesse sua conta para comparar academias</p>
      </div>

      <div class="auth-tabs">
        <button id="tabLogin" class="tab-btn active">Entrar</button>
        <button id="tabRegister" class="tab-btn">Cadastrar</button>
      </div>

      <form id="formLogin" class="auth-form">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="loginEmail" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
        </div>
        <button type="submit" class="btn-primary auth-submit-btn">Entrar na Plataforma</button>
      </form>

      <form id="formRegister" class="auth-form" style="display: none;">
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" id="regNome" placeholder="Ex: João Silva" required>
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="regEmail" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="regSenha" placeholder="Crie uma senha" required>
        </div>
        <button type="submit" class="btn-primary auth-submit-btn">Criar Minha Conta</button>
      </form>

      <div id="authAlert" class="auth-alert" style="display: none;"></div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
